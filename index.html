<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZOVE BYPASS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body { background-color: #0f0f11; color: #ffffff; }</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Header -->
    <div class="text-center mt-8">
        <h1 class="text-3xl font-bold flex items-center justify-center gap-2">
            <span class="text-purple-500">⚡</span> ZOVE BYPASS
        </h1>
        <p class="text-gray-400 text-sm mt-1">Unlock destination links instantly</p>
    </div>

    <!-- Main Card -->
    <div class="max-w-md w-full bg-[#18181b] border border-gray-800 rounded-2xl p-5 shadow-xl my-auto">
        <div class="mb-4">
            <div class="flex items-center bg-[#27272a] rounded-xl px-3 py-2 border border-gray-700">
                <span class="text-gray-400 mr-2">🔗</span>
                <input type="text" id="targetLink" placeholder="Paste a supported link..." class="bg-transparent w-full focus:outline-none text-sm text-white placeholder-gray-500">
            </div>
        </div>

        <button onclick="processBypass()" id="bypassBtn" class="w-full bg-purple-600 hover:bg-purple-700 transition font-semibold py-3 rounded-xl text-white shadow-lg shadow-purple-900/40">
            ⚡ Bypass Link
        </button>
        
        <!-- Result Output -->
        <div id="resultBox" class="mt-4 hidden p-3 bg-[#27272a] rounded-xl text-xs break-all border border-gray-700">
            <p class="text-gray-400 mb-1">Destination Unlocked:</p>
            <a id="finalLink" href="#" target="_blank" class="text-purple-400 underline font-medium text-sm"></a>
        </div>
    </div>

    <!-- Recent Bypasses -->
    <div class="max-w-md w-full mb-6 bg-[#18181b] border border-gray-800 rounded-2xl p-4">
        <h2 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Recent Bypasses</h2>
        <div id="historyList" class="text-xs text-gray-400 space-y-1">
            <p class="text-gray-600">No recent bypasses yet.</p>
        </div>
    </div>

    <script>
        async function processBypass() {
            const linkInput = document.getElementById('targetLink');
            const link = linkInput.value.trim();
            const btn = document.getElementById('bypassBtn');
            const resultBox = document.getElementById('resultBox');
            const finalLink = document.getElementById('finalLink');
            const historyList = document.getElementById('historyList');

            if (!link) {
                alert('Please enter a link first!');
                return;
            }

            btn.innerText = "Processing...";
            btn.disabled = true;
            resultBox.classList.add('hidden');

            try {
                const response = await fetch(`/api/bypass?url=${encodeURIComponent(link)}`);
                const data = await response.json();

                if (data.destination) {
                    resultBox.classList.remove('hidden');
                    finalLink.href = data.destination;
                    finalLink.innerText = data.destination;

                    if (historyList.innerHTML.includes('No recent bypasses yet')) {
                        historyList.innerHTML = '';
                    }
                    
                    const historyItem = document.createElement('div');
                    historyItem.className = "truncate text-gray-300";
                    historyItem.innerHTML = `• <a href="${data.destination}" target="_blank" class="hover:text-purple-400 underline">${data.destination}</a>`;
                    historyList.prepend(historyItem);

                    linkInput.value = '';
                } else {
                    alert('Failed to extract link. Make sure it is a supported URL.');
                }
            } catch (error) {
                alert('Connection error or server failed to respond.');
            } finally {
                btn.innerText = "⚡ Bypass Link";
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
