<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zove Lua Obfuscator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .glow:hover { box-shadow: 0 0 25px rgba(59, 130, 246, 0.4); }
    </style>
</head>
<body class="bg-[#090d16] text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <header class="w-full border-b border-slate-800/80 bg-[#090d16]/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
                    <i class="fa-solid fa-shield-halved text-white text-lg"></i>
                </div>
                <span class="font-extrabold text-lg tracking-wider bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">ZOVE <span class="text-blue-500">OBFUSCATOR</span></span>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 w-full flex-grow flex items-center justify-center py-10">
        <div class="glass rounded-2xl p-6 shadow-xl flex flex-col space-y-4 w-full">
            <div class="flex items-center justify-between">
                <label class="text-sm font-semibold text-slate-300 flex items-center space-x-2">
                    <i class="fa-solid fa-code text-blue-500"></i>
                    <span>Input Original Lua Script</span>
                </label>
                <button id="clearBtn" onclick="clearCode()" class="text-xs text-slate-400 transition-colors">Clear</button>
            </div>
            <textarea id="inputCode" oninput="checkInput()" placeholder="Paste your Lua script here..." class="w-full h-40 bg-[#0c1222] text-slate-200 text-sm font-mono p-4 rounded-xl border border-slate-800 focus:border-blue-500 focus:outline-none resize-none shadow-inner"></textarea>
            
            <button onclick="obfuscateCode()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-bold py-3.5 rounded-xl transition-all duration-300 shadow-lg shadow-blue-600/25 glow flex items-center justify-center space-x-2 text-sm">
                <i class="fa-solid fa-wand-magic-sparkles"></i>
                <span>Start Obfuscating Now</span>
            </button>

            <div class="flex items-center justify-between pt-2">
                <label class="text-sm font-semibold text-slate-300 flex items-center space-x-2">
                    <i class="fa-solid fa-file-shield text-emerald-500"></i>
                    <span>Protected Output Result</span>
                </label>
                <button onclick="copyOutput()" class="text-xs text-blue-400 hover:text-blue-300 transition-colors flex items-center space-x-1">
                    <i class="fa-regular fa-copy"></i>
                    <span>Copy Code</span>
                </button>
            </div>
            <textarea id="outputCode" readonly placeholder="Obfuscated result will appear here..." class="w-full h-40 bg-[#0c1222] text-emerald-400 text-sm font-mono p-4 rounded-xl border border-slate-800 resize-none shadow-inner"></textarea>
        </div>
    </main>

    <footer class="w-full border-t border-slate-800/80 py-6 text-center text-xs text-slate-500">
        <p>&copy; 2026 Zove Obfuscator. All rights reserved.</p>
    </footer>

    <script>
        function checkInput() {
            let code = document.getElementById('inputCode').value;
            let clearBtn = document.getElementById('clearBtn');
            
            if (code.trim().length > 0) {
                clearBtn.classList.remove('text-slate-400');
                clearBtn.classList.add('text-red-500', 'hover:text-red-400');
            } else {
                clearBtn.classList.remove('text-red-500', 'hover:text-red-400');
                clearBtn.classList.add('text-slate-400');
            }
        }

        function clearCode() {
            document.getElementById('inputCode').value = '';
            document.getElementById('outputCode').value = '';
            let clearBtn = document.getElementById('clearBtn');
            clearBtn.classList.remove('text-red-500', 'hover:text-red-400');
            clearBtn.classList.add('text-slate-400');
        }

        function obfuscateCode() {
            let code = document.getElementById('inputCode').value;
            
            if (!code.trim()) {
                return;
            }

            let encodedCode = btoa(unescape(encodeURIComponent(code)));

            let result = `-- ZOVE SCRIPT LUA PROTECT\n` +
                         `-- https://discord.gg/fcKnCrbhq\n\n` +
                         `local _zove_data = "${encodedCode}"\n` +
                         `local function _zove_decode(data)\n` +
                         `    local b = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'\n` +
                         `    data = string.gsub(data, '[^'..b..'=]', '')\n` +
                         `    return (data:gsub('.', function(x)\n` +
                         `        if (x == '=') then return '' end\n` +
                         `        local r,f='',(b:find(x)-1)\n` +
                         `        for i=6,1,-1 do r=r..(f%2^i-f%2^(i-1)>0 and '1' or '0') end\n` +
                         `        return r;\n` +
                         `    end):gsub('%d%d%d?%d?%d?%d?%d?%d?', function(x)\n` +
                         `        if (#x ~= 8) then return '' end\n` +
                         `        local c=0\n` +
                         `        for i=1,8 do c=c+(x:sub(i,i)=='1' and 2^(8-i) or 0) end\n` +
                         `        return string.char(c)\n` +
                         `    end))\n` +
                         `end\n\n` +
                         `pcall(function()\n` +
                         `    local realCode = _zove_decode(_zove_data)\n` +
                         `    loadstring(realCode)()\n` +
                         `end)`;

            document.getElementById('outputCode').value = result;
        }

        function copyOutput() {
            let output = document.getElementById('outputCode');
            if (!output.value) return;
            output.select();
            navigator.clipboard.writeText(output.value);
        }
    </script>
</body>
</html>
